# Phase 68 (UNIV-03) liquid-tier activation preset — construction / real-estate.
# Mechanism: the combiner reads ONLY this strategies: block; authoring it flips
# the sector from no_signals -> alive. Knobs FIXED inside the anti-curve-fit
# bounds; per-strategy params adopted verbatim from ru_finance.yaml. Real-estate
# names (SMLT, PIKK, ETLN, LSRG) are rate-sensitive with fewer reliable
# dividends -> dividend_gap OMITTED (no economic basis).
segment_id: ru_construction
normalize_mode: "firing"
min_combined_confidence: 0.38
min_exit_confidence: 0.2
strategies:
  momentum:
    enabled: true
    weight: 0.35
    params:
      rsi_period: 14
      rsi_oversold: 28
      rsi_overbought: 72
      macd_fast: 15
      macd_slow: 30
      macd_hist_lookback: 3
      min_confidence: 0.40
      lookback_bars: 5
      stop_atr_multiplier: 3.5
      trail_activation_atr: 1.5
      trail_distance_atr: 2.0
      trend_filter: true
      trend_sma_period: 100
      trend_sma_buffer_pct: 2.0
      adx_filter: false
      adx_period: 14
      adx_threshold: 20
      volume_filter: false
      volume_sma_period: 20
      volume_min_ratio: 0.8
      neutral_reset_bars: 8
      vol_target_enabled: true
      vol_target: 0.20
  mean_reversion:
    enabled: true
    weight: 0.50
    params:
      bb_period: 20
      bb_std_dev: 2.5
      min_confidence: 0.40
      exit_at_mean: true
      trend_filter: true
      trend_sma_period: 100
      trend_sma_buffer_pct: 3.0
      rsi_oversold_mr: 25
      rsi_overbought_mr: 75
  event_driven:
    enabled: true
    weight: 0.15
    params:
      min_sentiment: 0.6
      event_types: [regulatory, earnings, cbr_rate, macro]
