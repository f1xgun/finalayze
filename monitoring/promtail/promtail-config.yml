server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - finalayze-sandbox-app
              - finalayze-sandbox-db
              - finalayze-sandbox-redis
              - finalayze-sandbox-prometheus
              - finalayze-sandbox-loki
              - finalayze-sandbox-promtail
              - finalayze-sandbox-grafana
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_path']
        target_label: '__path__'
    pipeline_stages:
      # Parse JSON logs from the app
      - json:
          expressions:
            event: event
            level: level
            timestamp: timestamp
      - labels:
          level:
      # Use app timestamp instead of ingestion time
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z"
          fallback_formats:
            - "2006-01-02T15:04:05Z07:00"
      # Drop noisy health/metrics endpoint logs
      - match:
          selector: '{container="finalayze-sandbox-app"}'
          stages:
            - drop:
                expression: '(/metrics|/api/v1/health)'
                drop_counter_reason: "health_metrics_noise"
